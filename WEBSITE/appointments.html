<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Carelyo Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="main-content">
        <header class="page-header">
            <h2 class="page-title">Appointment Management</h2>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="ph ph-plus"></i>
                New Appointment
            </button>
        </header>

        <div class="card mb-6" style="padding: 16px 24px; display: flex; gap: 16px; align-items: center;">
            <i class="ph ph-funnel" style="color: var(--text-muted); font-size: 20px;"></i>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" id="filter-all">All (0)</button>
                <button class="filter-tab" data-filter="Scheduled" id="filter-scheduled">Scheduled (0)</button>
                <button class="filter-tab" data-filter="Upcoming" id="filter-upcoming">Upcoming (0)</button>
                <button class="filter-tab" data-filter="Completed" id="filter-completed">Completed (0)</button>
                <button class="filter-tab" data-filter="Cancelled" id="filter-cancelled">Cancelled (0)</button>
            </div>
        </div>

        <div id="appointments-container" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Data populated by JS -->
            <div class="card" style="text-align: center;">Loading appointments...</div>
        </div>
    </main>

    <!-- Appointment Modal -->
    <div id="appointment-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: white; padding: 24px; border-radius: 8px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto;">
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 16px;">New Appointment</h3>
            <form id="appointment-form">
                <input type="hidden" id="appt-id">
                
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Parent *</label>
                    <select id="appt-parent" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;" onchange="loadChildrenForDropdown()">
                        <option value="">Select a parent...</option>
                    </select>
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Child *</label>
                    <select id="appt-child" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;" disabled>
                        <option value="">Select a parent first...</option>
                    </select>
                </div>

                <div class="grid-2" style="gap: 12px; margin-bottom: 12px;">
                    <div>
                        <label style="display: block; margin-bottom: 4px;">Date *</label>
                        <input type="date" id="appt-date" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 4px;">Time *</label>
                        <input type="time" id="appt-time" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                    </div>
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Clinic Name</label>
                    <input type="text" id="appt-clinic" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Doctor Name</label>
                    <input type="text" id="appt-doctor" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Purpose</label>
                    <input type="text" id="appt-purpose" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Status *</label>
                    <select id="appt-status" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                        <option value="Scheduled">Scheduled</option>
                        <option value="Upcoming">Upcoming</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 4px;">Notes</label>
                    <textarea id="appt-notes" rows="3" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Close</button>
                    <button type="submit" class="btn btn-primary" id="save-appt-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="appointments.js"></script>
</body>
</html>
