<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Carelyo Staff</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Notification stats row */
        .notif-stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .notif-stat-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
        }
        .notif-stat-number {
            font-size: 34px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 6px;
        }
        .notif-stat-number.sent   { color: var(--primary-color); }
        .notif-stat-number.read   { color: #374151; }
        .notif-stat-number.unread { color: var(--danger-color); }
        .notif-stat-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            width: 480px;
            max-width: 95vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close {
            background: none; border: none;
            font-size: 22px; color: var(--text-muted); cursor: pointer;
        }
        .modal-close:hover { color: var(--text-main); }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; font-size: 13px;
            font-weight: 600; color: var(--text-main);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-main);
            background: #fff;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus { border-color: var(--primary-color); }
        textarea.form-control { resize: vertical; min-height: 90px; }
        .modal-footer {
            display: flex; justify-content: flex-end;
            gap: 12px; margin-top: 24px;
        }
        .btn-cancel {
            padding: 10px 20px; border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff; font-size: 14px;
            font-weight: 500; color: var(--text-main);
            cursor: pointer;
        }
        .btn-send {
            padding: 10px 22px; border-radius: 8px;
            background: var(--primary-color); color: #fff;
            border: none; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-send:hover { background: var(--primary-hover); }
        .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Toast */
        .toast {
            position: fixed; bottom: 28px; right: 28px;
            background: #1f2937; color: #fff;
            padding: 14px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 500;
            z-index: 500; display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .toast.success { background: var(--success-color); }
        .toast.error   { background: var(--danger-color); }
        .toast.show    { display: block; }
    </style>
</head>
<body>
    <main class="main-content">
        <header class="page-header">
            <h2 class="page-title">Notifications</h2>
            <button class="btn btn-primary" id="btn-open-send">
                <i class="ph ph-plus"></i> Send Notification
            </button>
        </header>

        <!-- Summary stats -->
        <div class="notif-stats-row">
            <div class="notif-stat-card">
                <div class="notif-stat-number sent" id="stat-sent">—</div>
                <div class="notif-stat-label">Sent</div>
            </div>
            <div class="notif-stat-card">
                <div class="notif-stat-number read" id="stat-read">—</div>
                <div class="notif-stat-label">Read</div>
            </div>
            <div class="notif-stat-card">
                <div class="notif-stat-number unread" id="stat-failed">—</div>
                <div class="notif-stat-label">Unread</div>
            </div>
        </div>

        <!-- Notifications table — schema cols: type, userid→USER.full_name, message, created_at, is_read -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Recipient</th>
                        <th>Message</th>
                        <th>Sent At</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="notifications-table-body">
                    <tr><td colspan="5" style="text-align:center;">Loading notifications...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Send Notification Modal -->
    <div class="modal-overlay" id="send-modal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">Send Notification</span>
                <button class="modal-close" id="btn-close-modal" title="Close">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <!-- Type + Channel row (Channel is UI-only — not stored in schema) -->
            <div style="display:flex; gap:16px; margin-bottom:16px;">
                <div style="flex:1;">
                    <label class="form-label" for="notif-type">Type</label>
                    <select class="form-control" id="notif-type">
                        <option value="General">General</option>
                        <option value="Appointment">Appointment</option>
                        <option value="Vaccination">Vaccination</option>
                        <option value="Medication">Medication</option>
                        <option value="Reminder">Reminder</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label class="form-label">Channel</label>
                    <select class="form-control" id="notif-channel">
                        <option value="In-App">In-App</option>
                        <option value="Email">Email</option>
                        <option value="SMS">SMS</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="notif-recipient">Recipient (Parent Name)</label>
                <select class="form-control" id="notif-recipient">
                    <option value="">Loading parents...</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="notif-title">Title</label>
                <input type="text" class="form-control" id="notif-title"
                       placeholder="e.g. Appointment Reminder" maxlength="120">
            </div>

            <div class="form-group">
                <label class="form-label" for="notif-message">Message</label>
                <textarea class="form-control" id="notif-message"
                          placeholder="Write your message here..." maxlength="500"></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" id="btn-cancel-modal">Cancel</button>
                <button class="btn-send" id="btn-send-notif">
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- App Scripts -->
    <script src="env.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
