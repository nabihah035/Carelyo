<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Carelyo Staff</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="main-content">
        <!-- Overview Header -->
        <header class="overview-header">
            <div class="overview-title-box">
                <h2 class="overview-title">Overview</h2>
                <p class="overview-date" id="overview-date">Loading date...</p>
            </div>
            <div class="header-user-badge">
                <span class="header-user-name" id="header-user-name">Staff Member</span>
                <div class="user-avatar-circle" id="header-user-avatar">NA</div>
            </div>
        </header>

        <section class="grid-3">
            <div class="dashboard-stat-card" onclick="window.location.href='appointments.html'" title="View Today's Appointments">
                <div class="stat-number" id="stat-appointments-today">-</div>
                <div>
                    <div class="stat-label">Today's Appointments</div>
                    <div class="stat-subtext">scheduled for today</div>
                </div>
            </div>
            
            <div class="dashboard-stat-card" onclick="window.location.href='parents.html'" title="View Registered Children & Parents">
                <div class="stat-number" id="stat-registered-children">-</div>
                <div>
                    <div class="stat-label">Registered Children</div>
                    <div class="stat-subtext">at this clinic</div>
                </div>
            </div>
            
            <div class="dashboard-stat-card" onclick="window.location.href='vaccinations.html'" title="View Overdue Vaccinations">
                <div class="stat-number danger" id="stat-overdue-vaccines">-</div>
                <div>
                    <div class="stat-label">Overdue Vaccinations</div>
                    <div class="stat-subtext">require follow-up</div>
                </div>
            </div>
        </section>

        <!-- Attention Required Banner — shows issues across Appointments, Vaccinations & Notifications -->
        <div class="attention-card" id="attention-card">
            <div style="width:100%;">
                <div class="attention-label">Attention Required</div>
                <div id="attention-issues-list" class="attention-issues-list">
                    <span style="color:#94a3b8;font-size:13px;">Checking for issues…</span>
                </div>
            </div>
        </div>

        <!-- Today's Schedule -->
        <div class="schedule-card">
            <div class="schedule-card-header">
                <h3 class="schedule-card-title">Today's Schedule</h3>
                <a href="appointments.html" class="schedule-view-all">
                    <span>View all</span>
                    <i class="ph ph-arrow-right"></i>
                </a>
            </div>
            <div class="schedule-list" id="today-schedule-list">
                <div style="padding: 24px; text-align: center; color: #64748b; font-size: 14px;">
                    Loading today's schedule...
                </div>
            </div>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="env.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
