<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Records - Carelyo Staff</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ── Breadcrumb ───────────────────────────────── */
        .hr-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .hr-bc-link {
            color: var(--primary-color);
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-family);
            font-size: 14px;
            padding: 0;
        }

        .hr-bc-link:hover { text-decoration: underline; }
        .hr-bc-sep { color: #94a3b8; }
        .hr-bc-cur { color: #374151; font-weight: 500; }

        /* ── Child info card ─────────────────────────── */
        .child-info-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }

        .child-info-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .child-avatar {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: var(--primary-color);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .child-info-name {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 5px;
        }

        .child-info-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #64748b;
        }

        .child-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .child-meta-divider {
            width: 1px;
            height: 14px;
            background: #e2e8f0;
        }

        .child-status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #bbf7d0;
            background: #f0fdf4;
            color: #16a34a;
        }

        /* ── Tabs ────────────────────────────────────── */
        .hr-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            gap: 0;
        }

        .hr-tab {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            font-family: var(--font-family);
            transition: var(--transition);
            white-space: nowrap;
        }

        .hr-tab:hover { color: #374151; }

        .hr-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* ── Tab panels ──────────────────────────────── */
        .hr-panel { display: none; }
        .hr-panel.active { display: block; }

        /* ── Overview cards ──────────────────────────── */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .overview-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
        }

        .overview-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
        }

        .overview-card-title i { font-size: 16px; }
        .ov-icon-red    { color: #ef4444; }
        .ov-icon-blue   { color: #3b82f6; }
        .ov-icon-purple { color: #a855f7; }

        .overview-item {
            font-size: 13px;
            color: #374151;
            margin-bottom: 4px;
        }

        .overview-none {
            font-size: 13px;
            color: #94a3b8;
        }

        /* ── Generic section table ───────────────────── */
        .hr-section-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }

        .hr-table {
            width: 100%;
            border-collapse: collapse;
        }

        .hr-table th {
            padding: 10px 18px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .hr-table td {
            padding: 13px 18px;
            font-size: 14px;
            color: #374151;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }

        .hr-table tbody tr:last-child td { border-bottom: none; }
        .hr-table tbody tr:hover { background: #f8fafc; }

        .severity-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
        }

        .sev-severe   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .sev-moderate { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .sev-mild     { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        .med-active-badge   { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
        .med-inactive-badge { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 600; }

        .empty-state {
            padding: 32px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="main-content" id="main-content">
        <!-- content injected by JS after data loads -->
        <div style="padding:48px;text-align:center;color:#64748b;">Loading child records…</div>
    </main>

    <!-- App Scripts -->
    <script src="env.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="health.js"></script>
</body>
</html>
