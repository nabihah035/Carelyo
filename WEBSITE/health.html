<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Records - Carelyo Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="main-content">
        <header class="page-header" style="align-items: flex-end;">
            <h2 class="page-title">Child Health Records</h2>
            <div style="background-color: var(--primary-light); color: var(--primary-color); padding: 8px 16px; border-radius: 8px; font-weight: 500; font-size: 14px;" id="total-children-badge">
                Total Children: 0
            </div>
        </header>

        <div class="card mb-6">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by child name or parent name...">
            </div>
        </div>

        <div id="health-records-container" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- Data populated by JS -->
            <div class="card" style="text-align: center;">Loading records...</div>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="health.js"></script>
</body>
</html>
