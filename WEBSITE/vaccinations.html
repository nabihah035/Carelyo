<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccination Status - Carelyo Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="main-content">
        <header class="page-header">
            <h2 class="page-title">Vaccination Status Monitoring</h2>
        </header>

        <section class="grid-4">
            <div class="card" style="border-left: 4px solid var(--text-muted);">
                <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 8px;">Total Children</div>
                <div style="font-size: 28px; font-weight: 600; margin-bottom: 8px;" id="vac-total">0</div>
                <div style="font-size: 13px; color: var(--text-muted);">Registered in system</div>
            </div>
            <div class="card" style="border-left: 4px solid var(--success-color); background-color: var(--success-bg); border-color: var(--success-light);">
                <div style="color: var(--success-color); font-size: 13px; margin-bottom: 8px;">Completed</div>
                <div style="font-size: 28px; font-weight: 600; color: var(--success-color); margin-bottom: 8px;" id="vac-uptodate">0</div>
                <div style="font-size: 13px; color: var(--success-color);">All vaccines completed</div>
            </div>
            <div class="card" style="border-left: 4px solid var(--primary-color); background-color: var(--primary-light); border-color: #dbeafe;">
                <div style="color: var(--primary-color); font-size: 13px; margin-bottom: 8px;">Pending</div>
                <div style="font-size: 28px; font-weight: 600; color: var(--primary-color); margin-bottom: 8px;" id="vac-pending">0</div>
                <div style="font-size: 13px; color: var(--primary-color);">Upcoming vaccines</div>
            </div>
            <div class="card" style="border-left: 4px solid var(--danger-color); background-color: var(--danger-bg); border-color: var(--danger-light);">
                <div style="color: var(--danger-color); font-size: 13px; margin-bottom: 8px;">Overdue</div>
                <div style="font-size: 28px; font-weight: 600; color: var(--danger-color); margin-bottom: 8px;" id="vac-overdue">0</div>
                <div style="font-size: 13px; color: var(--danger-color);">Requires attention</div>
            </div>
        </section>

        <div class="card mb-6" style="display: flex; gap: 16px; align-items: center; padding: 16px 24px;">
            <div class="search-bar" style="flex: 1; border: none; padding: 0; background: transparent;">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by child or parent name..." style="background: transparent;">
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="Complete">Complete</button>
                <button class="filter-tab" data-filter="Pending">Pending</button>
                <button class="filter-tab" data-filter="Overdue">Overdue</button>
            </div>
        </div>

        <div id="vaccination-records-container" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- Data populated by JS -->
            <div class="card" style="text-align: center;">Loading records...</div>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="vaccinations.js"></script>
</body>
</html>
