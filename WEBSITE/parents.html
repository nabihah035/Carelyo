<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Accounts - Carelyo Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="main-content">
        <header class="page-header">
            <h2 class="page-title">Parent Account Management</h2>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="ph ph-user-plus"></i>
                Add Parent
            </button>
        </header>

        <div class="card mb-6">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by name or email...">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Parent Name</th>
                        <th>Email</th>
                        <th>Children</th>
                        <th>Joined Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="parents-table-body">
                    <!-- Data populated by JS -->
                    <tr><td colspan="6" style="text-align: center;">Loading parents...</td></tr>
                </tbody>
            </table>
            <div style="padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color);">
                <span style="font-size: 13px; color: var(--text-muted);" id="pagination-info">Showing 0 of 0 parent accounts</span>
                <div style="display: flex; gap: 8px;">
                    <button id="prev-page-btn" class="btn btn-outline btn-sm">Previous</button>
                    <button id="page-number-btn" class="btn btn-primary btn-sm">1</button>
                    <button id="next-page-btn" class="btn btn-outline btn-sm">Next</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Parent Modal -->
    <div id="parent-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: white; padding: 24px; border-radius: 8px; width: 400px; max-width: 90%;">
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 16px;">Add Parent</h3>
            <form id="parent-form">
                <input type="hidden" id="parent-id">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Full Name *</label>
                    <input type="text" id="parent-name" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Email *</label>
                    <input type="email" id="parent-email" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px;">Phone Number</label>
                    <input type="text" id="parent-phone" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 4px;" id="password-label">Password *</label>
                    <input type="password" id="parent-password" required style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-parent-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="parents.js"></script>
</body>
</html>
