<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Accounts - Carelyo Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="main-content">
        <header class="page-header">
            <h2 class="page-title">Parent Account Management</h2>
            <button class="btn btn-primary">
                <i class="ph ph-user-plus"></i>
                Add Parent
            </button>
        </header>

        <div class="card mb-6">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by name or email...">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Parent Name</th>
                        <th>Email</th>
                        <th>Children</th>
                        <th>Joined Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="parents-table-body">
                    <!-- Data populated by JS -->
                    <tr><td colspan="6" style="text-align: center;">Loading parents...</td></tr>
                </tbody>
            </table>
            <div style="padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color);">
                <span style="font-size: 13px; color: var(--text-muted);" id="pagination-info">Showing 0 of 0 parent accounts</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-outline btn-sm">Previous</button>
                    <button class="btn btn-primary btn-sm">1</button>
                    <button class="btn btn-outline btn-sm">Next</button>
                </div>
            </div>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
    <script src="parents.js"></script>
</body>
</html>
